[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
solc_version = "0.8.24"
auto_detect_solc = false
optimizer = true
optimizer_runs = 10_000
bytecode_hash = "none"
cbor_metadata = false
# Deployment tests temporarily override process-wide environment variables to
# exercise the release verifier. Foundry test workers share that environment,
# so keep the suite deterministic instead of racing those overrides.
threads = 1

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"

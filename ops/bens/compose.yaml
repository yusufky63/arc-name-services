services:
  bens:
    image: "${BENS_IMAGE:?Set an immutable blockscout-ens image version@sha256 digest}"
    restart: unless-stopped
    command: ["blockscout-ens-server"]
    environment:
      BENS__CONFIG: /config/arc.json
      BENS__DATABASE__CONNECT__URL: "${BENS_DATABASE_URL:?required}"
      BENS__DATABASE__RUN_MIGRATIONS: "true"
      BENS__SERVER__HTTP__ADDR: 0.0.0.0:8050
      BENS__SERVER__HTTP__ENABLED: "true"
      BENS__SUBGRAPHS_READER__REFRESH_CACHE_DISABLED: "false"
    volumes:
      - ./config.generated.json:/config/arc.json:ro
    ports:
      - "127.0.0.1:8050:8050"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8050/health"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 30s
